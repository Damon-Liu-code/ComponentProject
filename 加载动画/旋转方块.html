<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋转方块</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3e5f5;
            color: #4a148c;
        }

        .container {
            text-align: center;
        }

        .export-button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #7b1fa2;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
        }

        .export-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background-color: #6a1b9a;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .cube-container {
            width: 50px;
            height: 50px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate-cube 2s infinite linear;
        }

        .cube-face {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #ab47bc;
            border: 2px solid #4a148c;
        }

        .cube-face.front  { transform: translateZ(25px); }
        .cube-face.back   { transform: rotateY(180deg) translateZ(25px); }
        .cube-face.right  { transform: rotateY(90deg) translateZ(25px); }
        .cube-face.left   { transform: rotateY(-90deg) translateZ(25px); }
        .cube-face.top    { transform: rotateX(90deg) translateZ(25px); }
        .cube-face.bottom { transform: rotateX(-90deg) translateZ(25px); }

        .loading-text {
            margin-top: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ab47bc;
        }

        @keyframes rotate-cube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="export-button" onclick="exportData()">导出数据</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="cube-container">
            <div class="cube-face front"></div>
            <div class="cube-face back"></div>
            <div class="cube-face right"></div>
            <div class="cube-face left"></div>
            <div class="cube-face top"></div>
            <div class="cube-face bottom"></div>
        </div>
        <div class="loading-text">加载中...</div>
    </div>

    <script>
        function exportData() {
            // 隐藏按钮，显示加载动画
            document.querySelector('.container').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // 模拟加载时间
            setTimeout(function() {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('数据导出完成');
                document.querySelector('.container').style.display = 'block';
            }, 5000); // 模拟5秒的加载时间
        }
    </script>
</body>
</html>
