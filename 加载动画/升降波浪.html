<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>升降波浪</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0f7fa;
            color: #006064;
        }

        .container {
            text-align: center;
        }

        .export-button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #006064;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
        }

        .export-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background-color: #004d40;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .wave-container {
            width: 150px;
            height: 150px;
            position: relative;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            top: 100%;
            left: 50%;
            width: 200%;
            height: 200%;
            background-color: #00acc1;
            border-radius: 40%;
            animation: wave-animation 2s infinite ease-in-out;
            transform: translateX(-50%);
        }

        .wave:nth-child(2) {
            animation-delay: 1s;
        }

        .loading-text {
            margin-top: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00acc1;
        }

        @keyframes wave-animation {
            0% {
                top: 100%;
            }
            50% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="export-button" onclick="exportData()">导出数据</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="wave-container">
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        <div class="loading-text">加载中...</div>
    </div>

    <script>
        function exportData() {
            // 隐藏按钮，显示进度条
            document.querySelector('.container').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // 模拟加载时间
            setTimeout(function() {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('数据导出完成');
                document.querySelector('.container').style.display = 'block';
            }, 5000); // 模拟5秒的加载时间
        }
    </script>
</body>
</html>
