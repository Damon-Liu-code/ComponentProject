<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩散波纹</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #512da8; /* 深紫色背景 */
            color: #ffffff;
        }

        .container {
            text-align: center;
        }

        .export-button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #7e57e2; /* 较亮的紫色按钮 */
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
        }

        .export-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background-color: #9575cd;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .ripple {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }

        .ripple::before, .ripple::after {
            content: '';
            position: absolute;
            border: 4px solid #d1c4e9; /* 浅紫色波纹 */
            border-radius: 50%;
            animation: ripple-animation 1.5s infinite ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        .ripple::before {
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            width: 100%;
            height: 100%;
        }

        .ripple::after {
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform: translate(-50%, -50%);
        }

        .loading-text {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: flicker 2s infinite;
            color: #d1c4e9; /* 浅紫色文字 */
        }

        @keyframes ripple-animation {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 100%;
                height: 100%;
                opacity: 0;
            }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="export-button" onclick="exportData()">导出数据</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="ripple"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <script>
        function exportData() {
            // 隐藏按钮，显示进度条
            document.querySelector('.container').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // 模拟加载时间
            setTimeout(function() {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('数据导出完成');
                document.querySelector('.container').style.display = 'block';
            }, 5000); // 模拟5秒的加载时间
        }
    </script>
</body>
</html>
