<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐变旋转</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
        }

        .container {
            text-align: center;
        }

        .export-button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
        }

        .export-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background-color: #e64a19;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .polygon-container {
            width: 100px;
            height: 100px;
            position: relative;
        }

        .polygon {
            width: 100px;
            height: 100px;
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(45deg, #ff5722, #ff9800, #ffeb3b, #4caf50, #2196f3, #3f51b5, #9c27b0);
            background-size: 400%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: rotate-polygon 2s infinite linear, color-shift 4s infinite ease-in-out;
        }

        .loading-text {
            margin-top: 30px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff9800;
        }

        @keyframes rotate-polygon {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes color-shift {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="export-button" onclick="exportData()">导出数据</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="polygon-container">
            <div class="polygon"></div>
        </div>
        <div class="loading-text">加载中...</div>
    </div>

    <script>
        function exportData() {
            // 隐藏按钮，显示加载动画
            document.querySelector('.container').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // 模拟加载时间
            setTimeout(function() {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('数据导出完成');
                document.querySelector('.container').style.display = 'block';
            }, 5000); // 模拟5秒的加载时间
        }
    </script>
</body>
</html>
