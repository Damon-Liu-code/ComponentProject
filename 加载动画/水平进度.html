<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水平进度</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            position: relative;
        }

        .container {
            text-align: center;
        }

        .export-button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease-in-out;
        }

        .export-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            background-color: #0056b3;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .progress-bar {
            width: 80%;
            max-width: 800px;
            background-color: #ffffff;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            height: 30px;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0;
            background-color: #00c6ff;
            background-image: linear-gradient(90deg, #0072ff, #00c6ff);
            border-radius: 35px;
            text-align: center;
            color: white;
            line-height: 30px;
            font-size: 16px;
            font-weight: bold;
            transition: width 0.4s ease-in-out;
        }

        .loading-text {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="export-button" onclick="exportData()">导出数据</button>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="progress-bar">
            <div class="progress-bar-fill" id="progressBarFill">0%</div>
        </div>
        <div class="loading-text">请稍候...</div>
    </div>

    <script>
        function exportData() {
            // 隐藏按钮，显示进度条
            document.querySelector('.container').style.display = 'none';
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            let progressBarFill = document.getElementById('progressBarFill');
            let progress = 0;

            // 模拟导出数据的进度
            let progressInterval = setInterval(function() {
                progress += 10;
                progressBarFill.style.width = progress + '%';
                progressBarFill.textContent = progress + '%';

                if (progress >= 100) {
                    clearInterval(progressInterval);
                    setTimeout(function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        alert('数据导出完成');
                        document.querySelector('.container').style.display = 'block';
                    }, 500); // 确保进度条显示100%后再结束
                }
            }, 500); // 每500ms增加10%的进度
        }
    </script>
</body>
</html>
